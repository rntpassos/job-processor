name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore src/JobProcessor.slnx

      - name: Build
        run: dotnet build src/JobProcessor.slnx --no-restore -c Release

      - name: Test
        run: dotnet test src/JobProcessor.slnx --no-build -c Release --logger "trx;LogFileName=test-results.trx"

      - name: Format check
        run: dotnet format src/JobProcessor.slnx --verify-no-changes --no-restore

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            src/Api/bin/Release/
            src/Worker/bin/Release/
